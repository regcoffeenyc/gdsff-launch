<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — გვერდი ვერ მოიძებნა | GDSFF</title>
  <style>
    :root { --bg:#0d0f12; --red:#c8293a; --text:#e8eaf0; --muted:#6b7280; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans Georgian", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .code {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      color: var(--red);
      letter-spacing: -0.02em;
    }
    h1 { font-size: 1.4rem; margin: 1rem 0 0.5rem; }
    p { color: var(--muted); font-size: 0.95rem; margin-bottom: 2rem; }
    a {
      display: inline-block;
      background: var(--red);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      padding: 0.75rem 2rem;
      border-radius: 3px;
      letter-spacing: 0.05em;
    }
    a:hover { background: #e63346; }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>გვერდი ვერ მოიძებნა</h1>
    <p>ეს გვერდი არ არსებობს ან გადატანილია.<br/>Page not found.</p>
    <a href="/">მთავარ გვერდზე დაბრუნება</a>
  </div>
</body>
</html>
